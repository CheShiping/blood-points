<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
body {
  background: linear-gradient(160deg, #1a0000 0%, #3d0000 30%, #7f1d1d 60%, #991b1b 100%);
  display: flex; align-items: center; justify-content: center;
}
.container { text-align: center; color: #fff; position: relative; z-index: 2; }
.top-bar { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #DC2626, #F87171, #DC2626); }
.icon { font-size: 72px; margin-bottom: 32px; filter: drop-shadow(0 8px 24px rgba(220,38,38,0.4)); }
h1 { font-size: 64px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 16px; }
.subtitle { font-size: 28px; font-weight: 400; color: rgba(255,255,255,0.7); margin-bottom: 48px; }
.tag { display: inline-block; padding: 8px 24px; border: 1px solid rgba(255,255,255,0.3); border-radius: 999px; font-size: 16px; color: rgba(255,255,255,0.8); margin: 0 8px; }
.bottom { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; }
.bottom p { font-size: 18px; color: rgba(255,255,255,0.5); }
.glow { position: absolute; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(220,38,38,0.15) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
</style>
</head>
<body>
<div class="top-bar"></div>
<div class="glow"></div>
<div class="container">
  <div class="icon">🩸</div>
  <h1>BloodPoints · 热血链</h1>
  <p class="subtitle">基于区块链的献血积分管理系统</p>
  <div>
    <span class="tag">Solidity</span>
    <span class="tag">Hardhat</span>
    <span class="tag">React</span>
    <span class="tag">Sepolia</span>
  </div>
</div>
<div class="bottom">
  <p>区块链技术课程 · 答辩演示</p>
</div>
</body>
</html>
